<!doctype html>
<!-- Lab call screen for `dropbeam-lab call-node` (labkit::call_node). Same WebRTC
     flow as src/lib/calls.ts — relay-only through the node's 127.0.0.1 TURN
     bridge, non-trickle offer/answer through the engine — with synthetic,
     clock-stamped media (no camera/mic needed) and the delay probe of
     src/lib/callLab.ts. ?call=<friendId>&video=1&secs=60 places a call; without
     ?call it answers whatever rings. -->
<html><body style="background:#111;color:#eee;font:14px sans-serif"><pre id=log></pre><script>
const q = new URLSearchParams(location.search)
const api = (cmd, body) => fetch('/api/' + cmd, { method: 'POST', body: JSON.stringify(body || {}) }).then(r => r.json()).then(j => { if (j && j.error) throw new Error(j.error); return j })
const say = (...a) => { document.getElementById('log').textContent += a.join(' ') + '\n'; api('report', { log: a.join(' ') }).catch(() => {}) }
const BLOCK = 40, BITS = 32
async function media(video) {
  // ?gum=1: the browser's own (fake) capture devices — the real capture path.
  if (q.get('gum')) return navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { width: 1280, height: 720, frameRate: 30 } : false })
  return fakeMedia(video)
}
function fakeMedia(video) {
  const ctx = new AudioContext({ sampleRate: 48000 }), dest = ctx.createMediaStreamDestination()
  const schedule = () => { const wall = Date.now(), t0 = ctx.currentTime
    for (let k = 0; k < 3; k++) { const b = Math.ceil(wall / 1000) * 1000 + k * 1000, at = t0 + (b - wall) / 1000
      const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 1000
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.5, at + 0.002); g.gain.setValueAtTime(0.5, at + 0.058); g.gain.linearRampToValueAtTime(0, at + 0.06)
      o.connect(g).connect(dest); o.start(at); o.stop(at + 0.07) } }
  schedule(); setInterval(schedule, 3000)
  const tracks = [...dest.stream.getAudioTracks()]
  if (video) { const c = document.createElement('canvas'); c.width = 1280; c.height = 720; const g = c.getContext('2d'); let f = 0
    setInterval(() => { f++; g.fillStyle = `hsl(${(f * 2) % 360} 50% 30%)`; g.fillRect(0, 0, 1280, 720)
      g.fillStyle = '#e94'; g.beginPath(); g.arc(640 + 300 * Math.sin(f / 30), 400, 90, 0, 7); g.fill()
      const now = Date.now() >>> 0; for (let i = 0; i < BITS; i++) { g.fillStyle = (now >>> (BITS - 1 - i)) & 1 ? '#fff' : '#000'; g.fillRect(i * BLOCK, 0, BLOCK, BLOCK) } }, 1000 / 30)
    tracks.push(c.captureStream(30).getVideoTracks()[0]) }
  return new MediaStream(tracks)
}
const median = xs => { if (!xs.length) return null; const s = [...xs].sort((a, b) => a - b); return s[Math.floor(s.length / 2)] }
function probe(remote, report) {
  const a2e = [], g2g = [], ctx = new AudioContext({ sampleRate: 48000 })
  const src = ctx.createMediaStreamSource(remote), proc = ctx.createScriptProcessor(256, 1, 1); let quiet = 0
  proc.onaudioprocess = e => { const d = e.inputBuffer.getChannelData(0); let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i]
    const rms = Math.sqrt(s / d.length)
    if (rms > 0.05 && quiet > 20) { const at = Date.now() - 256 / 48; const late = at - Math.round(at / 1000) * 1000; if (late >= 0 && late < 900) a2e.push(late); quiet = 0 } else if (rms < 0.01) quiet++ }
  src.connect(proc); proc.connect(ctx.destination)
  const v = document.createElement('video'); v.muted = true; v.srcObject = remote; v.play()
  const c = document.createElement('canvas'); c.width = BITS * BLOCK; c.height = BLOCK; const g = c.getContext('2d', { willReadFrequently: true })
  setInterval(() => { if (!v.videoWidth) return; const sc = v.videoWidth / 1280
    g.drawImage(v, 0, 0, BITS * BLOCK * sc, BLOCK * sc, 0, 0, BITS * BLOCK, BLOCK); const px = g.getImageData(0, 0, BITS * BLOCK, BLOCK).data; let n = 0
    for (let i = 0; i < BITS; i++) { const o = ((BLOCK / 2) * BITS * BLOCK + i * BLOCK + BLOCK / 2) * 4; n = n * 2 + (px[o] + px[o + 1] + px[o + 2] > 384 ? 1 : 0) }
    const late = ((Date.now() >>> 0) - (n >>> 0)) >>> 0; if (late < 5000) g2g.push(late) }, 100)
  setInterval(() => { report({ a2eMs: median(a2e), g2gMs: median(g2g), beeps: a2e.length, frames: g2g.length }); a2e.length = 0; g2g.length = 0 }, 5000)
}
let pc = null, callId = null, last = null
function makePc(turn) {
  const p = new RTCPeerConnection({ iceServers: [{ urls: turn.urls, username: turn.username, credential: turn.credential }], iceTransportPolicy: 'relay', bundlePolicy: 'max-bundle', rtcpMuxPolicy: 'require' })
  const remote = new MediaStream(); let probing = false
  p.ontrack = e => { remote.addTrack(e.track); if (!probing && remote.getAudioTracks().length && remote.getVideoTracks().length) { probing = true; if (q.get('gum')) setInterval(() => stats({}), 5000); else probe(remote, r => stats(r)) } }
  p.onconnectionstatechange = () => { say('pc', p.connectionState); if (p.connectionState === 'connected') api('media_up', { callId }) }
  return p
}
async function tune(p) { for (const s of p.getSenders()) { if (!s.track) continue; const pr = s.getParameters(); if (!pr.encodings || !pr.encodings.length) pr.encodings = [{}]
  if (s.track.kind === 'audio') { pr.encodings[0].maxBitrate = 128000; pr.encodings[0].priority = 'high'; pr.encodings[0].networkPriority = 'high' } else { pr.encodings[0].maxBitrate = 2500000; pr.encodings[0].maxFramerate = 30 }
  try { await s.setParameters(pr) } catch (e) {} } }
const gathered = p => new Promise(r => { if (p.iceGatheringState === 'complete') return r(); p.onicegatheringstatechange = () => p.iceGatheringState === 'complete' && r(); setTimeout(r, 3000) })
async function stats(probeResult) {
  if (!pc) return; const r = await pc.getStats(); let rtt = null, sent = 0, recv = 0, lost = 0, got = 0, jbd = 0, jbn = 0, jitter = null, video = null
  r.forEach(s => { if (s.type === 'candidate-pair' && s.state === 'succeeded' && s.nominated && s.currentRoundTripTime != null) rtt = Math.round(s.currentRoundTripTime * 1000)
    if (s.type === 'outbound-rtp') sent += s.bytesSent || 0
    if (s.type === 'inbound-rtp') { recv += s.bytesReceived || 0; if (s.kind === 'audio') { lost += s.packetsLost || 0; got += s.packetsReceived || 0; jitter = Math.round((s.jitter || 0) * 1000); jbd += s.jitterBufferDelay || 0; jbn += s.jitterBufferEmittedCount || 0 }
      if (s.kind === 'video' && s.frameWidth) video = { w: s.frameWidth, h: s.frameHeight, fps: Math.round(s.framesPerSecond || 0) } } })
  const now = performance.now(); let out = { ...probeResult, rttMs: rtt, jitterMs: jitter, video }
  if (last) { const sec = (now - last.now) / 1000; out.sendKbps = Math.round((sent - last.sent) * 8 / 1000 / sec); out.recvKbps = Math.round((recv - last.recv) * 8 / 1000 / sec)
    const dl = lost - last.lost, dg = got - last.got; out.lossPct = dl + dg ? Math.round(1000 * dl / (dl + dg)) / 10 : 0; if (jbn > last.jbn) out.jbMs = Math.round(1000 * (jbd - last.jbd) / (jbn - last.jbn)) }
  last = { now, sent, recv, lost, got, jbd, jbn }
  try { const e = await api('stats', { callId }); out.path = e.path && e.path.path; out.irohRttMs = e.path && e.path.rttMs; out.bridge = e.bridge && { maxDatagram: e.bridge.maxDatagram, fragmented: e.bridge.fragmentedOut, dropped: e.bridge.sendDropped } } catch (e) {}
  api('report', { metrics: out })
}
async function placeCall() {
  const video = q.get('video') !== '0', local = await media(video), t0 = performance.now()
  const st = await api('start', { friendId: q.get('call'), video }); callId = st.callId
  pc = makePc(st.turn); local.getTracks().forEach(t => pc.addTransceiver(t, { direction: 'sendrecv', streams: [local] })); if (!video) pc.addTransceiver('video', { direction: 'sendrecv' })
  await tune(pc); await pc.setLocalDescription(await pc.createOffer()); await gathered(pc); await api('offer', { callId, sdp: pc.localDescription.sdp })
  say('ringing', callId)
  pc.addEventListener('connectionstatechange', () => { if (pc.connectionState === 'connected') say('connected after ms', Math.round(performance.now() - t0)) })
  const secs = +(q.get('secs') || 60); setTimeout(() => api('hangup', { callId }), secs * 1000)
}
async function answer(c) {
  callId = c.id; const acc = await api('accept', { callId }), local = await media(true)
  pc = makePc(acc.turn); await pc.setRemoteDescription({ type: 'offer', sdp: acc.sdp })
  const tr = pc.getTransceivers(); for (const t of local.getTracks()) { const x = tr.find(y => y.receiver.track.kind === t.kind); if (x) { await x.sender.replaceTrack(t); x.direction = 'sendrecv' } }
  await tune(pc); await pc.setLocalDescription(await pc.createAnswer()); await gathered(pc); await api('answer', { callId, sdp: pc.localDescription.sdp }); say('answered', callId)
}
setInterval(async () => { const evs = await api('events').catch(() => []); for (const e of evs) {
  if (e.name === 'call://incoming' && !pc) answer(e.data).catch(err => say('answer failed', err))
  if (e.name === 'call://signal' && e.data.kind === 'call.answer' && pc) pc.setRemoteDescription({ type: 'answer', sdp: e.data.sdp }).catch(err => say('answer sdp', err))
  if (e.name === 'call://state' && e.data.phase === 'ended') { say('ended', e.data.end); if (pc) { pc.close(); pc = null; last = null } }
} }, 200)
if (q.get('call')) placeCall().catch(e => say('call failed', e))
</script></body></html>
