[package]
name = "app"
version = "0.10.1"
description = "DropBeam — seamless peer-to-peer file transfer"
authors = ["DropBeam"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time", "fs"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
whoami = "1"
regex = "1"
notify = "6"
trash = "5"
base64 = "0.22"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# Single-instance: forwards a second launch's file argument to the running app,
# powering the Windows "Send with DropBeam" right-click menu. Used on Windows
# only (macOS already single-instances .app bundles + uses the menu-bar drag).
tauri-plugin-single-instance = "2"
# Next-gen transport (Phase 1+): direct P2P with NAT hole-punching, replacing
# croc's relay-only model. Raw QUIC streams — no iroh-blobs (not yet 1.0).
iroh = { version = "0.98", features = ["address-lookup-mdns"] }
# iroh's quinn fork — gives us BbrConfig for the congestion controller. Pinned to
# the same minor iroh 0.98.x depends on so the ControllerFactory trait matches
# (bump together with iroh).
noq-proto = { version = "0.17", default-features = false }
anyhow = "1"

# Windows only: iroh's `wmi` dep (via netwatch) declares windows + windows-core
# with a wide range and the resolver split it into windows 0.62 / windows-core
# 0.61 (the latter unified with Tauri's tao), which doesn't compile. Pinning the
# API surface to 0.62 here gives wmi a consistent 0.62 pair. (tao keeps its own
# 0.61 — the two coexist fine.)
[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = "0.62"

# macOS only: native menu-bar drag-to-open. We attach a file-drag-accepting
# overlay to the status-item button so dragging a file over the icon springs the
# popover open (Tauri keeps its tray's NSStatusItem private, so we go native).
# Pinned to the same objc2 stack Tauri/tray-icon already use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
# Converts the popover window into a non-activating NSPanel so it can appear OVER
# full-screen apps (a plain NSWindow can't, since Big Sur) without stealing focus
# or hiding the Dock icon. Pinned to a v2.1 commit (objc2-based, matches our stack).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

# Keep the dev build small on a tight disk: no debug symbols (saves several GB in target/).
[profile.dev]
debug = 0
strip = true

# Small release binary for the shipped .dmg/.msi (thin LTO keeps build time sane).
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
