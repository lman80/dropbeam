name: test-build

# Private test installers: push any commit to the `test-build` branch to get
# UNSIGNED release installers as workflow artifacts. Never creates or touches a
# GitHub Release, so users and the updater never see it.
on:
  push:
    branches: [test-build]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: test-build

      - run: npm ci

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf binutils xdg-utils

      # No updater signature (needs the release key) — this build is for testing only.
      - name: Build installer
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) B=nsis ;; Linux) B=deb ;; macOS) B=dmg ;;
          esac
          npx tauri build --bundles "$B" --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: dropbeam-test-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
