name: build-check

# Every push to main/ios and every PR: the frontend type-checks, builds and is
# linted, and the Rust backend is compiled, unit-tested and clippy'd on macOS,
# Windows AND Linux — so a platform-only break surfaces before a release.
on:
  push:
    branches: [main, ios]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` = `tsc -b && vite build` (type-check + production bundle).
      - name: Type-check + build
        run: npm run build

      - name: ESLint
        run: npx eslint .

  rust:
    strategy:
      fail-fast: false
      matrix:
        # macos-15, not macos-latest — see release.yml (macOS 26 image hdiutil bug).
        platform: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same version as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - run: npm ci

      # generate_context! embeds the built frontend, so dist must exist.
      - name: Build frontend
        run: npm run build

      # Single-threaded: several engine tests bind real sockets / share globals.
      # On Windows (the runner is an administrator) DROPBEAM_CI_TASK_TEST also
      # registers, reads, runs and removes the real startup task through Task
      # Scheduler COM, and round-trips a scratch HKCU\Environment value.
      - name: Unit tests
        working-directory: src-tauri
        env:
          DROPBEAM_CI_TASK_TEST: ${{ runner.os == 'Windows' && '1' || '' }}
        run: cargo test --lib -- --test-threads=1

      # The `dropbeam` command line lives in the app binary (cli.rs): it must run
      # without starting any window, and on Windows the dropbeam.cmd shim the
      # app installs must wait for it and hand back its exit code.
      - name: CLI smoke test
        working-directory: src-tauri
        shell: bash
        run: |
          cargo build --bin DropBeam
          bin=target/debug/DropBeam
          $bin cli version
          $bin cli ops --json > ops.json && grep -q "\"chat.send\"" ops.json
          $bin cli mcp --no-start <<< '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' > tools.json && grep -q '"chat_wait"' tools.json
          set +e; $bin cli status --no-start; code=$?; set -e
          test "$code" = 1
          if [ "$RUNNER_OS" = "Windows" ]; then
            printf '@echo off\r\n"%%~dp0DropBeam.exe" cli %%*\r\nexit /b %%ERRORLEVEL%%\r\n' > target/debug/dropbeam.cmd
            cmd //c 'target\debug\dropbeam.cmd version' > version.txt && grep -q dropbeam version.txt
            set +e; cmd //c 'target\debug\dropbeam.cmd status --no-start'; code=$?; set -e
            test "$code" = 1
          fi

      # Windows: the internal elevated jobs (elevate.rs) through main.rs, run
      # directly (the runner is already elevated): strict argument checks, then
      # the real startup task registered by DropBeam.exe itself — checked with
      # schtasks here in CI only — and removed again.
      - name: Elevated jobs smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          bin=target/debug/DropBeam.exe
          for bad in "--background-task" "--background-task install" "--fix-webdav extra" "--background-task remove now"; do
            set +e; $bin $bad; code=$?; set -e
            echo "$bad -> $code"; test "$code" = 2
          done
          cfg="$(cygpath -w "$RUNNER_TEMP")\\dropbeam ci config"
          mkdir -p "$(cygpath -u "$cfg")"
          set +e; $bin --background-task register --config "$cfg" --user "$USERNAME" --extra; code=$?; set -e; test "$code" = 2
          set +e; $bin --background-task register --config "C:\\nope\\missing" --user "$USERNAME"; code=$?; set -e; test "$code" = 2
          $bin --background-task register --config "$cfg" --user "$USERDOMAIN\\$USERNAME"
          schtasks /Query /TN "DropBeam Background" /XML | tr -d "\000" > task.xml
          cat task.xml
          grep -q "<LogonType>S4U</LogonType>" task.xml
          grep -q "<BootTrigger" task.xml
          grep -q "<ExecutionTimeLimit>PT0S</ExecutionTimeLimit>" task.xml
          grep -q "DropBeam.exe</Command>" task.xml
          grep -q -- "--server --config .*dropbeam ci config" task.xml
          $bin --background-task remove
          set +e; schtasks /Query /TN "DropBeam Background" > /dev/null 2>&1; code=$?; set -e; test "$code" != 0
          $bin --background-task remove
          # WebClient isn't installed on Windows Server: only check the job runs.
          set +e; $bin --fix-webdav; echo "fix-webdav -> $?"; set -e

      # Warnings are listed, errors fail the job.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets
