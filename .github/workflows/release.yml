name: Release

# Push a version tag (e.g. v0.1.1) to build installers for macOS + Windows,
# sign them for the in-app updater, and publish a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to macos-15 (NOT macos-latest): the macos-latest image rolled to
          # macOS 26 in mid-June 2026, whose hdiutil regressed — `bundle_dmg.sh` dies
          # with "hdiutil: create failed - Resource busy" (~6s) even though the .app
          # builds + signs fine. macos-15 (the last stable, Apple Silicon) creates the
          # DMG reliably. Revisit when the macOS 26 runner image stabilizes.
          - platform: macos-15 # universal: Apple Silicon + Intel in one .dmg
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest # Windows x64 (.exe / .msi)
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches app version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$TAG conf=$CONF cargo=$CARGO"
          test "$TAG" = "$CONF" || { echo "::error::tag v$TAG != tauri.conf.json $CONF"; exit 1; }
          test "$TAG" = "$CARGO" || { echo "::error::tag v$TAG != Cargo.toml $CARGO"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      # macOS only: Spotlight auto-mounts + indexes the DMG while tauri's
      # bundle_dmg.sh is still attaching it, which intermittently fails the bundle
      # with "hdiutil: create/attach failed - Resource busy" on the GitHub runner
      # images (started after a mid-June-2026 image roll). Turning indexing off for
      # the run removes that contention so DMG creation is reliable.
      - name: Disable Spotlight indexing (avoid hdiutil "Resource busy")
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DropBeam ${{ github.ref_name }}"
          releaseBody: |
            ## Download DropBeam

            - **macOS** (Apple Silicon & Intel): grab the **`.dmg`**, open it, drag DropBeam to Applications.
            - **Windows**: grab the **`.exe`** installer and run it.

            **First launch (the app is unsigned, so the OS blocks it once):**
            - **macOS (newest):** double‑click → "Apple could not verify…" → **Done**. Then **System Settings → Privacy & Security → Open Anyway** (authenticate, Open Anyway again). *(Older macOS: right‑click → Open.)*
            - **Windows:** SmartScreen → **More info → Run anyway**.

            After that it opens normally and **updates install themselves** from inside the app — no re‑downloading.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
